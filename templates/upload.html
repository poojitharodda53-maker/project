{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>Upload Question Paper</h1>
    <p>Upload your UGC NET Computer Science previous-year question paper PDF.</p>

    <form action="{{ url_for('upload') }}" method="POST" enctype="multipart/form-data">

        <label for="year">Select Exam Year:</label>
        <input type="number" id="year" name="year"
               placeholder="Example: 2025" required>

        <br><br>

        <label for="exam_name">Exam Name:</label>
        <input type="text" id="exam_name" name="exam_name"
               placeholder="Example: June 2025" required>

        <br><br>

        <label for="pdf_file">Choose PDF File:</label>
        <input type="file" id="pdf_file" name="pdf_file"
               accept=".pdf" required>

        <br><br>

        <button type="submit">Upload PDF</button>
    </form>
</div>
{% endblock %}
